<!DOCTYPE html>
<html lang="en" class="govuk-template">

<head>
    <meta charset="utf-8">
    <title>GOV.UK - The best place to find government services and information</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d70b8">
    <link rel="stylesheet" href="/stylesheets/govuk-frontend.min.css">
    <link rel="stylesheet" href="govuk-frontend.min.css" />
    <link rel="stylesheet" href="/styles/i-ai-design-system.min.css" />
    <link rel="icon" sizes="48x48" href="/assets/images/favicon.ico">
    <link rel="icon" sizes="any" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="mask-icon" href="/assets/images/govuk-icon-mask.svg" color="#1d70b8">
    <link rel="apple-touch-icon" href="/assets/images/govuk-icon-180.png">
    <link rel="manifest" href="/assets/manifest.json">
</head>

<body class="govuk-template__body">
    <script>
        document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');
    </script>
    <a href="#main-content" class="govuk-skip-link" data-module="govuk-skip-link">Skip to main content</a>

        <div class="govuk-generic-header">
            <div class="govuk-generic-header__container govuk-width-container">
                <div class="govuk-generic-header__logo">
                    <a href="#" class="govuk-generic-header__homepage-link">
                        <svg width="28" height="30" viewBox="0 0 28 30" fill="currentColor"
                            xmlns="http://www.w3.org/2000/svg">
                            <circle cx="13.5549" cy="4.21349" r="4.21349" />
                            <circle cx="13.5549" cy="25.7865" r="4.21349" />
                            <circle cx="22.8963" cy="9.6068" r="4.21349" />
                            <circle cx="4.2135" cy="20.3932" r="4.21349" />
                            <circle cx="22.8963" cy="20.3932" r="4.21349" />
                            <circle cx="4.21351" cy="9.60674" r="4.21349" />
                        </svg> Service name

            </div>
        </div>
    </header>
    <div class="govuk-width-container">
        <main class="govuk-main-wrapper" id="main-content">
            <h1 class="govuk-heading-xl">Page content</h1>
        </main>
    </div>
    <script type="module" src="/javascripts/govuk-frontend.min.js"></script>
    <script type="module" src="/javascripts/i-ai-design-system.min.js"></script>
    <script type="module">
        import {
            initAll
        } from '/javascripts/govuk-frontend.min.js'
        import {
            initAllIAIDesignSystem
        } from '/javascripts/i-ai-design-system.min.js'
        initAll()
        initAllIAIDesignSystem()
    </script>
</body>

</html>
