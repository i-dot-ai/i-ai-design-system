<div class="govuk-form-group">
  <fieldset class="govuk-fieldset">
    <legend class="govuk-fieldset__legend">What is your nationality?</legend>
    <div class="govuk-checkboxes govuk-checkboxes--small" data-module="govuk-checkboxes">
      <div class="govuk-checkboxes__item">
        <input class="govuk-checkboxes__input" type="checkbox" id="nationality-small" name="nationality-small" value="british">
        <label class="govuk-label govuk-checkboxes__label" for="nationality-small">
          British
        </label>
      </div>
      <div class="govuk-checkboxes__item">
        <input class="govuk-checkboxes__input" type="checkbox" id="nationality-small-2" name="nationality-small" value="irish">
        <label class="govuk-label govuk-checkboxes__label" for="nationality-small-2">
          Irish
        </label>
      </div>
      <div class="govuk-checkboxes__item">
        <input class="govuk-checkboxes__input" type="checkbox" id="nationality-small-3" name="nationality-small" value="other">
        <label class="govuk-label govuk-checkboxes__label" for="nationality-small-3">
          Citizen of another country
        </label>
      </div>
    </div>
  </fieldset>
</div>
